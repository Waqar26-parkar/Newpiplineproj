version: 2.1

executors:
  python-executor:
    docker:
      - image: circleci/python:3.10

jobs:
  build:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run linting
          command: |
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - run:
          name: Run tests
          command: pytest --cov=.

  deploy:
    docker:
      - image: circleci/python:3.10
    steps:
      - checkout
      - run:
          name: Login to Azure
          command: |
            az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
      - run:
          name: Build and push Docker image
          command: |
            az acr build --registry pycidcdregistry --image my-flask-app:latest .

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
